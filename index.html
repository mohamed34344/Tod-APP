<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Todo App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="App">
      <header class="Header">
        <button class="DarkThemeToggle">
          <span class="DarkThemeToggle__activate">تفعيل</span>
          <span class="DarkThemeToggle__deactivate">إيقاف</span>
          الوضع الليلي
        </button>
        <div class="SocialLinks">
          <a href="https://www.facebook.com/mohamed.zake.3994/" target="_blank"
            ><i
              class="fa-brands fa-facebook"
              style="color: rgb(21, 94, 226)"
            ></i
          ></a>
          <a
            href="https://www.linkedin.com/in/mohamed-alasfer-884273351/"
            target="_blank"
            ><i
              class="fa-brands fa-linkedin"
              style="color: rgb(25, 101, 238)"
            ></i
          ></a>
          <a href="https://www.youtube.com/@Mohamed-code234" target="_blank"
            ><i class="fa-brands fa-youtube" style="color: rgb(230, 11, 11)"></i
          ></a>
          <a href="https://github.com/mohamed34344" target="_blank"
            ><i class="fa-brands fa-github" style="color: rgb(15, 15, 15)"></i
          ></a>
        </div>
      </header>

      <div class="App__wrapper">
        <div class="TaskSearchBar">
          <label for="search-input" class="TaskSearchBar__label">
            قائمة المهام
          </label>
          <form class="TaskSearchBar__searchContent">
            <input
              id="search-input"
              class="TaskSearchBar__input"
              type="text"
              placeholder="قم بإضافة مهمه..."
              required
            />
            <button class="TaskSearchBar__button">إضافة</button>
          </form>
        </div>

        <div class="TaskList">
          <button class="TaskList__link">
            <span class="show">إظهار</span
            ><span class="hide">إخفاء</span> المهام المكتملة
          </button>
          <ul class="TaskList__list"></ul>
        </div>
      </div>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
